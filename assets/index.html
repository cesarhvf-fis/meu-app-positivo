<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Meu App Positivo</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/panel-glass.css"><script src="/bridge.js"></script></head><body>
<main><header><div class="phone-brand"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M9 17v-1c0-2-4-3-4-7a7 7 0 0 1 14 0c0 4-4 5-4 7v1Zm0 3h6m-4 2h2" fill="none" stroke="#c09dff" stroke-width="1.6" stroke-linecap="round"/></svg><span>CASA / LÂMPADA</span></div><button id="settings" class="quiet" aria-label="Configurações">⚙</button></header><div id="notice" role="status" hidden></div>
<section id="login" class="login-layout"><form id="login-form" class="panel"><h2>Entrar na sua casa</h2><p>Use sua conta do aplicativo Positivo.</p><label>E-mail<input id="login-email" type="email" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><button type="submit" class="primary">Entrar</button><small>A senha não é salva. Sua sessão fica protegida neste Android para você usar o botão rápido.</small></form></section>
<section id="dashboard" hidden><div class="phone-title"><select id="lamp-picker" aria-label="Lâmpada controlada pelo botão rápido" hidden></select><div class="lamp-choice"><button id="lamp-choice" class="lamp-choice-button" aria-expanded="false">Escolher lâmpada <span>⌄</span></button><div id="lamp-menu" hidden></div></div><button id="schedule" class="quiet" aria-label="Agendar">◷</button></div><p id="lamp-status" class="device-status"></p><div id="phone-controls"></div></section>
<nav id="phone-tabs" hidden aria-label="Modos da lâmpada"><button data-mode="white">Branco</button><button data-mode="colour">Cores</button><button data-mode="scene">Efeitos</button><button data-mode="others">Outros</button></nav></main>
<dialog id="editor"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close-dialog" class="quiet" aria-label="Fechar">×</button></div><div id="dialog-body"></div><p id="dialog-error" role="status"></p><div id="dialog-actions" class="dialog-actions"></div></dialog><script src="/app.js"></script><script src="/features.js"></script></body></html>
