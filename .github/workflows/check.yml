name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check publication content
        run: python3 tools/audit_public.py .
      - name: Check JavaScript syntax
        run: for file in assets/*.js; do node --check "$file"; done
      - name: Test publication checks
        run: python3 -B -m unittest discover -s tests -p 'test_*.py'
